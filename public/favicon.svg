<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Tati Investment app icon: the logo's gold "TI" on its charcoal ground. Letterforms are plain
       rectangles so the mark renders the same everywhere; everything sits inside the central 80%
       so Android's maskable crop never clips it. Source for icon-192/512.png and apple-touch-icon.png. -->
  <defs>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="129" x2="0" y2="349">
      <stop offset="0" stop-color="#F7BA45"/>
      <stop offset="1" stop-color="#E0861C"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#2E2F33"/>
  <g fill="url(#gold)">
    <rect x="121" y="129" width="190" height="56"/>
    <rect x="188" y="129" width="56" height="220"/>
    <rect x="335" y="129" width="56" height="220"/>
  </g>
  <rect x="121" y="375" width="270" height="8" fill="#F7BA45" opacity="0.45"/>
</svg>
