<!DOCTYPE html>
<html lang="en" class="nx-light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{padding:18px 22px;font-family:var(--nx-font-body)}
  .grid{display:grid;gap:10px}
  .sw{border-radius:var(--nx-r-3);border:1px solid var(--border);padding:10px 12px;display:flex;flex-direction:column;justify-content:flex-end;min-height:64px}
  .n{font-family:var(--nx-font-mono);font-size:10px;letter-spacing:0;line-height:1.5}
  .l{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;line-height:1.6}
  .row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
</style>
</head>
<body>
<div style="display:flex;flex-direction:column;gap:18px">
<div><span class="nx-eyebrow">Client management</span></div>
<div style="max-width:280px"><label class="nx-label" style="margin-bottom:6px">Invoice reference</label><div style="height:34px;border-bottom:1px solid var(--nx-rule-strong);font-family:var(--nx-font-mono);font-size:13px;display:flex;align-items:center">INV-2026-0117</div></div>
<div style="max-width:280px"><label class="nx-label" style="margin-bottom:6px;color:var(--nx-brass)">Focused</label><div style="height:34px;border-bottom:1px solid var(--nx-brass);font-size:13px;display:flex;align-items:center">Roads Authority</div></div>
</div>
</body>
</html>
