<!-- @dsCard group="Colors" viewport="700x130" subtitle="The optional dark mode. Same tokens, one class away" name="Ink · dark alternative" -->
<!DOCTYPE html>
<html lang="en" class="nx-light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{padding:18px 22px;font-family:var(--nx-font-body)}
  .grid{display:grid;gap:10px}
  .sw{border-radius:var(--nx-r-3);border:1px solid var(--border);padding:10px 12px;display:flex;flex-direction:column;justify-content:flex-end;min-height:74px}
  .n{font-family:var(--nx-font-mono);font-size:10px;letter-spacing:0;line-height:1.5}
  .l{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;line-height:1.6}
  .row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
</style>
</head>
<body>
<div class="grid" style="grid-template-columns:repeat(4,1fr)">
<div class="sw" style="background:#0A0907"><div class="l" style="color:#C8BDA3">Rail</div><div class="n" style="color:#C8BDA3;opacity:.8">#0A0907</div></div>
<div class="sw" style="background:#0E0D0B"><div class="l" style="color:#C8BDA3">Page</div><div class="n" style="color:#C8BDA3;opacity:.8">#0E0D0B</div></div>
<div class="sw" style="background:#1A1814"><div class="l" style="color:#C8BDA3">Card</div><div class="n" style="color:#C8BDA3;opacity:.8">#1A1814</div></div>
<div class="sw" style="background:#B68A3E"><div class="l" style="color:#0E0D0B">Accent</div><div class="n" style="color:#0E0D0B;opacity:.8">#B68A3E</div></div>
</div>
<div class="n" style="color:var(--muted-foreground);margin-top:10px">&lt;html class="nx-ink"&gt; · offered as an alternative, not the default</div>
</body>
</html>
