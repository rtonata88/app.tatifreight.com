<!-- @dsCard group="Brand" viewport="700x130" subtitle="Uppercase, tracked, dot-led pills — the only allowed status form" name="Status taxonomy" -->
<!DOCTYPE html>
<html lang="en" class="nx-light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{padding:18px 22px;font-family:var(--nx-font-body)}
  .grid{display:grid;gap:10px}
  .sw{border-radius:var(--nx-r-3);border:1px solid var(--border);padding:10px 12px;display:flex;flex-direction:column;justify-content:flex-end;min-height:64px}
  .n{font-family:var(--nx-font-mono);font-size:10px;letter-spacing:0;line-height:1.5}
  .l{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;line-height:1.6}
  .row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
</style>
</head>
<body>
<div class="row" style="align-items:center">
<span style="display:inline-flex;align-items:center;gap:7px;padding:3px 10px;border:1px solid #28a745;color:#28a745;border-radius:9999px;font-size:11px;font-weight:600;letter-spacing:.08em"><span style="width:5px;height:5px;border-radius:999px;background:#28a745"></span>ACTIVE</span><span style="display:inline-flex;align-items:center;gap:7px;padding:3px 10px;border:1px solid #b45309;color:#b45309;border-radius:9999px;font-size:11px;font-weight:600;letter-spacing:.08em"><span style="width:5px;height:5px;border-radius:999px;background:#b45309"></span>PENDING</span><span style="display:inline-flex;align-items:center;gap:7px;padding:3px 10px;border:1px solid #17a2b8;color:#17a2b8;border-radius:9999px;font-size:11px;font-weight:600;letter-spacing:.08em"><span style="width:5px;height:5px;border-radius:999px;background:#17a2b8"></span>COMPLETED</span><span style="display:inline-flex;align-items:center;gap:7px;padding:3px 10px;border:1px solid #dc3545;color:#dc3545;border-radius:9999px;font-size:11px;font-weight:600;letter-spacing:.08em"><span style="width:5px;height:5px;border-radius:999px;background:#dc3545"></span>DECLINED</span><span style="display:inline-flex;align-items:center;gap:7px;padding:3px 10px;border:1px solid #dc3545;color:#dc3545;border-radius:9999px;font-size:11px;font-weight:600;letter-spacing:.08em"><span style="width:5px;height:5px;border-radius:999px;background:#dc3545"></span>OVERDUE</span><span style="display:inline-flex;align-items:center;gap:7px;padding:3px 10px;border:1px solid #6c757d;color:#6c757d;border-radius:9999px;font-size:11px;font-weight:600;letter-spacing:.08em"><span style="width:5px;height:5px;border-radius:999px;background:#6c757d"></span>INACTIVE</span>
</div>
<div class="nx-meta" style="margin-top:14px">Counts and taxonomies use flat-cornered wash badges instead — never a pill.</div>
</body>
</html>
