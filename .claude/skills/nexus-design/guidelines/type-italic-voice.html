<!-- @dsCard group="Type" viewport="700x150" subtitle="Plain DM Sans in muted slate — no editorial affectation" name="Subtitles and dossier keys" -->
<!DOCTYPE html>
<html lang="en" class="nx-light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{padding:18px 22px;font-family:var(--nx-font-body)}
  .grid{display:grid;gap:10px}
  .sw{border-radius:var(--nx-r-3);border:1px solid var(--border);padding:10px 12px;display:flex;flex-direction:column;justify-content:flex-end;min-height:64px}
  .n{font-family:var(--nx-font-mono);font-size:10px;letter-spacing:0;line-height:1.5}
  .l{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;line-height:1.6}
  .row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
</style>
</head>
<body>
<div style="display:flex;flex-direction:column;gap:16px">
<div><div class="nx-h2">Leave applications</div><div style="font-size:14px;color:var(--muted-foreground);margin-top:6px">Applications waiting on your approval, oldest first.</div></div>
<div style="max-width:420px">
<div style="display:flex;gap:16px;padding:8px 0;border-bottom:1px dotted var(--input)"><span style="font-size:13px;font-weight:500;color:var(--muted-foreground);width:140px">Submitted by</span><span style="font-size:13px;font-weight:500">Tangeni Shipanga</span></div>
<div style="display:flex;gap:16px;padding:8px 0"><span style="font-size:13px;font-weight:500;color:var(--muted-foreground);width:140px">Finance sign-off</span><span style="font-size:13px;font-weight:500">Awaiting review</span></div>
</div></div>
</body>
</html>
