<!-- @dsCard group="Type" viewport="700x180" subtitle="16 card title · 14 prose · 13 the working body size · 12 meta · 11 label floor" name="UI scale" -->
<!DOCTYPE html>
<html lang="en" class="nx-light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{padding:18px 22px;font-family:var(--nx-font-body)}
  .grid{display:grid;gap:10px}
  .sw{border-radius:var(--nx-r-3);border:1px solid var(--border);padding:10px 12px;display:flex;flex-direction:column;justify-content:flex-end;min-height:64px}
  .n{font-family:var(--nx-font-mono);font-size:10px;letter-spacing:0;line-height:1.5}
  .l{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;line-height:1.6}
  .row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
</style>
</head>
<body>
<div style="display:flex;flex-direction:column;gap:9px">
<div style="display:flex;align-items:baseline;gap:14px"><span class="n" style="color:var(--nx-fg-3);width:44px">16</span><span class="nx-h4">Client invoices</span></div>
<div style="display:flex;align-items:baseline;gap:14px"><span class="n" style="color:var(--nx-fg-3);width:44px">14</span><span class="nx-body">Prose and card copy sit at fourteen.</span></div>
<div style="display:flex;align-items:baseline;gap:14px"><span class="n" style="color:var(--nx-fg-3);width:44px">13</span><span style="font-size:13px">Table cells, form values, dense UI.</span></div>
<div style="display:flex;align-items:baseline;gap:14px"><span class="n" style="color:var(--nx-fg-3);width:44px">12</span><span class="nx-meta">Meta, captions, timestamps.</span></div>
<div style="display:flex;align-items:baseline;gap:14px"><span class="n" style="color:var(--nx-fg-3);width:44px">11</span><span class="nx-label">Field label</span></div>
</div>
</body>
</html>
