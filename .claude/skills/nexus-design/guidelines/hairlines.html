<!DOCTYPE html>
<html lang="en" class="nx-light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{padding:18px 22px;font-family:var(--nx-font-body)}
  .grid{display:grid;gap:10px}
  .sw{border-radius:var(--nx-r-3);border:1px solid var(--border);padding:10px 12px;display:flex;flex-direction:column;justify-content:flex-end;min-height:64px}
  .n{font-family:var(--nx-font-mono);font-size:10px;letter-spacing:0;line-height:1.5}
  .l{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;line-height:1.6}
  .row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
</style>
</head>
<body>
<div style="display:flex;flex-direction:column;gap:16px">
<div><div class="l" style="color:var(--muted-foreground);margin-bottom:8px">Standard · 8%</div><hr class="nx-rule"></div>
<div><div class="l" style="color:var(--muted-foreground);margin-bottom:8px">Strong · 14%</div><hr class="nx-rule-x"></div>
<div><div class="l" style="color:var(--nx-brass);margin-bottom:8px">Accent · used once per screen</div><hr class="nx-rule-brass"></div>
</div>
</body>
</html>
