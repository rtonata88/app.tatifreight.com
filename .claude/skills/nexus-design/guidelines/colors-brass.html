<!-- @dsCard group="Colors" viewport="700x120" subtitle="#4e73df from the app's --ep-primary. One accent per region" name="Accent · Nexus blue" -->
<!DOCTYPE html>
<html lang="en" class="nx-light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{padding:18px 22px;font-family:var(--nx-font-body)}
  .grid{display:grid;gap:10px}
  .sw{border-radius:var(--nx-r-3);border:1px solid var(--border);padding:10px 12px;display:flex;flex-direction:column;justify-content:flex-end;min-height:78px}
  .n{font-family:var(--nx-font-mono);font-size:10px;letter-spacing:0;line-height:1.5}
  .l{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;line-height:1.6}
  .row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
</style>
</head>
<body>
<div class="grid" style="grid-template-columns:repeat(5,1fr)">
<div class="sw" style="background:#4e73df"><div class="l" style="color:#ffffff">Primary</div><div class="n" style="color:#ffffff;opacity:.8">#4e73df</div></div>
<div class="sw" style="background:#6f8de8"><div class="l" style="color:#ffffff">Hover</div><div class="n" style="color:#ffffff;opacity:.8">#6f8de8</div></div>
<div class="sw" style="background:#3b5bc0"><div class="l" style="color:#ffffff">Pressed</div><div class="n" style="color:#ffffff;opacity:.8">#3b5bc0</div></div>
<div class="sw" style="background:rgba(78,115,223,0.06)"><div class="l" style="color:#2d3748">Wash 6%</div><div class="n" style="color:#2d3748;opacity:.8">rgba(78,115,223,0.06)</div></div>
<div class="sw" style="background:rgba(78,115,223,0.10)"><div class="l" style="color:#2d3748">Wash 10%</div><div class="n" style="color:#2d3748;opacity:.8">rgba(78,115,223,0.10)</div></div>
</div>
</body>
</html>
