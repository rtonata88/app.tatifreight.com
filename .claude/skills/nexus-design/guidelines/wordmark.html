<!-- @dsCard group="Brand" viewport="700x150" subtitle="No logo ships with Nexus — the name is set in DM Sans until a mark exists" name="Wordmark (placeholder)" -->
<!DOCTYPE html>
<html lang="en" class="nx-light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{padding:18px 22px;font-family:var(--nx-font-body)}
  .grid{display:grid;gap:10px}
  .sw{border-radius:var(--nx-r-3);border:1px solid var(--border);padding:10px 12px;display:flex;flex-direction:column;justify-content:flex-end;min-height:64px}
  .n{font-family:var(--nx-font-mono);font-size:10px;letter-spacing:0;line-height:1.5}
  .l{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;line-height:1.6}
  .row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
</style>
</head>
<body>
<div style="display:flex;align-items:center;gap:32px;flex-wrap:wrap">
<span style="font-family:var(--nx-font-display);font-weight:700;font-size:30px;letter-spacing:-.01em">Nexus</span>
<div style="width:56px;height:56px;border:1px solid var(--nx-rule-brass);border-radius:var(--nx-r-4);display:flex;align-items:center;justify-content:center;background:var(--nx-brass-wash-2)"><span style="font-family:var(--nx-font-display);font-weight:700;font-size:20px;color:var(--nx-brass)">NX</span></div>
<div class="nx-meta" style="max-width:300px">The framed monogram stands in for a mark. Send a real wordmark and it replaces both.</div>
</div>
</body>
</html>
