<!-- @dsCard group="Colors" viewport="700x120" subtitle="Page, elevated, card, row hover — the app's own --ep-bg ladder" name="Surfaces · Slate (default)" -->
<!DOCTYPE html>
<html lang="en" class="nx-light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{padding:18px 22px;font-family:var(--nx-font-body)}
  .grid{display:grid;gap:10px}
  .sw{border-radius:var(--nx-r-3);border:1px solid var(--border);padding:10px 12px;display:flex;flex-direction:column;justify-content:flex-end;min-height:78px}
  .n{font-family:var(--nx-font-mono);font-size:10px;letter-spacing:0;line-height:1.5}
  .l{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;line-height:1.6}
  .row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
</style>
</head>
<body>
<div class="grid" style="grid-template-columns:repeat(4,1fr)">
<div class="sw" style="background:#f8f9fa"><div class="l" style="color:#2d3748">Page</div><div class="n" style="color:#2d3748;opacity:.8">#f8f9fa</div></div>
<div class="sw" style="background:#f1f3f5"><div class="l" style="color:#2d3748">Elevated</div><div class="n" style="color:#2d3748;opacity:.8">#f1f3f5</div></div>
<div class="sw" style="background:#ffffff"><div class="l" style="color:#2d3748">Card</div><div class="n" style="color:#2d3748;opacity:.8">#ffffff</div></div>
<div class="sw" style="background:#f1f3f5"><div class="l" style="color:#2d3748">Row hover</div><div class="n" style="color:#2d3748;opacity:.8">#f1f3f5</div></div>
</div>
</body>
</html>
