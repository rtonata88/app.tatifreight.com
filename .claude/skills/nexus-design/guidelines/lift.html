<!-- @dsCard group="Brand" viewport="700x160" subtitle="Soft shadows in light mode; hairline rings in the dark alternative" name="Elevation" -->
<!DOCTYPE html>
<html lang="en" class="nx-light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{padding:18px 22px;font-family:var(--nx-font-body)}
  .grid{display:grid;gap:10px}
  .sw{border-radius:var(--nx-r-3);border:1px solid var(--border);padding:10px 12px;display:flex;flex-direction:column;justify-content:flex-end;min-height:64px}
  .n{font-family:var(--nx-font-mono);font-size:10px;letter-spacing:0;line-height:1.5}
  .l{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;line-height:1.6}
  .row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
</style>
</head>
<body>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">
<div style="background:var(--card);border:1px solid var(--border);border-radius:var(--nx-r-4);padding:16px;box-shadow:var(--nx-lift-0)"><div class="l" style="color:var(--muted-foreground)">Resting</div><div class="n" style="color:var(--muted-foreground);margin-top:6px">lift-0</div></div>
<div style="background:var(--card);border:1px solid var(--border);border-radius:var(--nx-r-4);padding:16px;box-shadow:var(--nx-lift-1)"><div class="l" style="color:var(--foreground)">Hovered</div><div class="n" style="color:var(--muted-foreground);margin-top:6px">lift-1</div></div>
<div style="background:var(--card);border:1px solid var(--nx-rule-brass);border-radius:var(--nx-r-4);padding:16px;box-shadow:var(--nx-lift-brass)"><div class="l" style="color:var(--nx-brass)">Emphasis</div><div class="n" style="color:var(--muted-foreground);margin-top:6px">lift-brass</div></div>
</div>
</body>
</html>
