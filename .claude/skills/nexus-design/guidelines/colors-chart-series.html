<!-- @dsCard group="Colors" viewport="700x120" subtitle="Ordered series for cash flow, expense breakdown and budgets" name="Chart series" -->
<!DOCTYPE html>
<html lang="en" class="nx-light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{padding:18px 22px;font-family:var(--nx-font-body)}
  .grid{display:grid;gap:10px}
  .sw{border-radius:var(--nx-r-3);border:1px solid var(--border);padding:10px 12px;display:flex;flex-direction:column;justify-content:flex-end;min-height:70px}
  .n{font-family:var(--nx-font-mono);font-size:10px;letter-spacing:0;line-height:1.5}
  .l{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;line-height:1.6}
  .row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
</style>
</head>
<body>
<div class="grid" style="grid-template-columns:repeat(6,1fr)">
<div class="sw" style="background:#4e73df"><div class="l" style="color:#ffffff">01</div><div class="n" style="color:#ffffff;opacity:.8">#4e73df</div></div>
<div class="sw" style="background:#28a745"><div class="l" style="color:#ffffff">02</div><div class="n" style="color:#ffffff;opacity:.8">#28a745</div></div>
<div class="sw" style="background:#17a2b8"><div class="l" style="color:#ffffff">03</div><div class="n" style="color:#ffffff;opacity:.8">#17a2b8</div></div>
<div class="sw" style="background:#f59e0b"><div class="l" style="color:#ffffff">04</div><div class="n" style="color:#ffffff;opacity:.8">#f59e0b</div></div>
<div class="sw" style="background:#dc3545"><div class="l" style="color:#ffffff">05</div><div class="n" style="color:#ffffff;opacity:.8">#dc3545</div></div>
<div class="sw" style="background:#6c757d"><div class="l" style="color:#ffffff">06</div><div class="n" style="color:#ffffff;opacity:.8">#6c757d</div></div>
</div>
</body>
</html>
