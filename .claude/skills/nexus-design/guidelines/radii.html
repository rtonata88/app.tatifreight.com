<!-- @dsCard group="Spacing" viewport="700x120" subtitle="Flat is the default; 6 for controls, 8 for cards, 12 for dialogs" name="Radii" -->
<!DOCTYPE html>
<html lang="en" class="nx-light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{padding:18px 22px;font-family:var(--nx-font-body)}
  .grid{display:grid;gap:10px}
  .sw{border-radius:var(--nx-r-3);border:1px solid var(--border);padding:10px 12px;display:flex;flex-direction:column;justify-content:flex-end;min-height:64px}
  .n{font-family:var(--nx-font-mono);font-size:10px;letter-spacing:0;line-height:1.5}
  .l{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;line-height:1.6}
  .row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
</style>
</head>
<body>
<div class="row">
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:56px;height:44px;border:1px solid var(--nx-rule-brass);background:var(--nx-brass-wash);border-radius:0px"></div><span class="n" style="color:var(--nx-fg-3)">0</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:56px;height:44px;border:1px solid var(--nx-rule-brass);background:var(--nx-brass-wash);border-radius:2px"></div><span class="n" style="color:var(--nx-fg-3)">2</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:56px;height:44px;border:1px solid var(--nx-rule-brass);background:var(--nx-brass-wash);border-radius:4px"></div><span class="n" style="color:var(--nx-fg-3)">4</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:56px;height:44px;border:1px solid var(--nx-rule-brass);background:var(--nx-brass-wash);border-radius:6px"></div><span class="n" style="color:var(--nx-fg-3)">6</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:56px;height:44px;border:1px solid var(--nx-rule-brass);background:var(--nx-brass-wash);border-radius:8px"></div><span class="n" style="color:var(--nx-fg-3)">8</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:56px;height:44px;border:1px solid var(--nx-rule-brass);background:var(--nx-brass-wash);border-radius:12px"></div><span class="n" style="color:var(--nx-fg-3)">12</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:56px;height:24px;border:1px solid var(--nx-rule-brass);background:var(--nx-brass-wash);border-radius:9999px"></div><span class="n" style="color:var(--nx-fg-3)">pill</span></div>
</div>
</body>
</html>
