<!DOCTYPE html>
<html lang="en" class="nx-light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}

  .sw{border-radius:var(--nx-r-3);border:1px solid var(--border);padding:10px 12px;display:flex;flex-direction:column;justify-content:flex-end;min-height:64px}

<div><div class="l" style="color:var(--muted-foreground);margin-bottom:2px">JetBrains Mono · codes</div><div style="font-family:var(--nx-font-mono);font-size:15px">INV-2026-0117</div></div>
</div>
</div>
